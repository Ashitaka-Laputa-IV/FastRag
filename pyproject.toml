[project]
name = "fastrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.15",
    "chonkie>=1.7.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-reranker>=0.1.4",
    "langgraph>=1.2.17",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
]

[project.scripts]
fastrag = "fastrag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
