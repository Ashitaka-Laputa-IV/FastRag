[project]
name = "fastrag"
version = "0.2.0"
description = "本地文档混合检索（BM25 + 向量）问答示例，支持可插拔的嵌入、重排与 LLM"
readme = "README.md"
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bm25s>=0.3.15",
    "chonkie>=1.7.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-reranker>=0.1.4",
    "langgraph>=1.2.17",
    "numpy>=2.5.4",
    "pydantic>=2.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
fastrag = "fastrag.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
