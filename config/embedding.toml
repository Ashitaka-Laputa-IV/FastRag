# 嵌入模型参数；API key 与 base_url 只从环境变量（.env）读取，不写入仓库文件。

[model]
name = "Qwen/Qwen3-Embedding-4B"
batch_size = 32             # 单次请求的文本条数
dimensions = 2560           # Qwen3-Embedding-4B 输出维度

[paths]
chunks_file = "data/chunks.jsonl"
out_dir = "data/embeddings"  # vectors.npy + manifest.json

[api]
api_key_env = "SILICONFLOW_API_KEY"
base_url_env = "SILICONFLOW_BASE_URL"
timeout = 120               # 单次请求超时（秒）
max_retries = 3
